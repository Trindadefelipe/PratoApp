<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFE — Painel da Delegacia Especializada</title>
  <style>
    :root {
      --verde-profundo: #194A3D;
      --verde-claro: #E6F3ED;
      --creme: #FAF7F2;
      --coral: #D9534F;
      --amarelo-escuro: #B78103;
      --amarelo-claro: #FFF8E6;
      --grafite: #2E3A36;
      --cinza: #6E7F78;
      --branco: #FFFFFF;
      --borda: #E2DDD5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--creme);
      color: var(--grafite);
      padding: 24px;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--borda);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 22px;
      color: var(--verde-profundo);
    }

    .brand span {
      background: var(--verde-claro);
      color: var(--verde-profundo);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--cinza);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #27AE60;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .card h3 {
      font-size: 13px;
      color: var(--cinza);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .card .value {
      font-size: 32px;
      font-weight: 700;
    }

    .card.novo .value { color: var(--coral); }
    .card.atendimento .value { color: var(--amarelo-escuro); }
    .card.total .value { color: var(--verde-profundo); }

    .table-container {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #F4EFE6;
      color: var(--grafite);
      padding: 14px 16px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--borda);
    }

    td {
      padding: 14px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--borda);
      vertical-align: middle;
    }

    tr:hover {
      background: #FAF9F6;
    }

    .badge-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-novo {
      background: #FDE8E8;
      color: var(--coral);
      border: 1px solid #F8B4B4;
    }

    .badge-atendimento {
      background: var(--amarelo-claro);
      color: var(--amarelo-escuro);
      border: 1px solid #FCE96A;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-atender {
      background: var(--verde-profundo);
      color: var(--branco);
    }

    .btn-concluir {
      background: #27AE60;
      color: var(--branco);
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-refresh {
      background: var(--branco);
      border: 1px solid var(--borda);
      color: var(--grafite);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 48px;
      color: var(--cinza);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Painel de Ocorrências e Monitoramento</h1>
      <span>SAFE / Delegacia</span>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      <span id="tempo-atualizacao">Atualizando a cada 5s</span>
      <button class="btn-refresh" onclick="buscarAlertas()">Atualizar Agora</button>
    </div>
  </header>

  <div class="metrics">
    <div class="card total">
      <h3>Total em Aberto</h3>
      <div class="value" id="metrica-total">0</div>
    </div>
    <div class="card novo">
      <h3>Alertas Novos</h3>
      <div class="value" id="metrica-novos">0</div>
    </div>
    <div class="card atendimento">
      <h3>Em Atendimento</h3>
      <div class="value" id="metrica-atendimento">0</div>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Data/Hora</th>
          <th>Usuária</th>
          <th>Gatilho</th>
          <th>Localização</th>
          <th>Viagem Vinculada</th>
          <th>Status</th>
          <th>Ações da Central</th>
        </tr>
      </thead>
      <tbody id="tabela-alertas">
        <tr>
          <td colspan="7" class="empty-state">Carregando alertas da API...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = 'http://localhost:3333';

    async function buscarAlertas() {
      try {
        const res = await fetch(`${API_URL}/painel`);
        if (!res.ok) throw new Error('Falha ao conectar com o painel');
        const dados = await res.json();

        document.getElementById('metrica-total').textContent = dados.total_abertos || 0;
        document.getElementById('metrica-novos').textContent = dados.novos || 0;
        document.getElementById('metrica-atendimento').textContent = dados.em_atendimento || 0;

        const tbody = document.getElementById('tabela-alertas');
        if (!dados.alertas || dados.alertas.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Nenhum alerta ativo ou pendente no momento.</td></tr>';
          return;
        }

        tbody.innerHTML = dados.alertas.map(a => {
          const data = new Date(a.criado_em).toLocaleString('pt-BR');
          const isNovo = a.status_delegacia === 'NOVO';
          const badgeClass = isNovo ? 'badge-novo' : 'badge-atendimento';
          const badgeText = isNovo ? 'Novo Alerta' : 'Em Atendimento';

          const viagemInfo = a.viagem_origem 
            ? `<strong>${a.viagem_origem}</strong> ➔ ${a.viagem_destino}`
            : '<span style="color: #999;">Sem viagem ativa</span>';

          const acaoBtn = isNovo
            ? `<button class="btn btn-atender" onclick="mudarStatus('${a.id}', 'EM_ATENDIMENTO')">Assumir Atendimento</button>`
            : `<button class="btn btn-concluir" onclick="mudarStatus('${a.id}', 'CONCLUIDO')">Concluir Caso</button>`;

          return `
            <tr>
              <td><strong>${data}</strong></td>
              <td><strong>${a.usuaria_nome || 'Usuária'}</strong><br><small style="color: #777;">${a.usuaria_email || ''}</small></td>
              <td><code>${a.tipo_gatilho}</code></td>
              <td>${a.endereco_aproximado || 'Londrina/PR'}<br><small style="color: #777;">(${a.latitude.toFixed(4)}, ${a.longitude.toFixed(4)})</small></td>
              <td>${viagemInfo}</td>
              <td><span class="badge-status ${badgeClass}">${badgeText}</span></td>
              <td>${acaoBtn}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        document.getElementById('tabela-alertas').innerHTML = `
          <tr><td colspan="7" class="empty-state" style="color: var(--coral);">
            ⚠️ Certifique-se de que a API está rodando em http://localhost:3333 (npm start na pasta api).
          </td></tr>
        `;
      }
    }

    async function mudarStatus(id, novoStatus) {
      try {
        const res = await fetch(`${API_URL}/alertas/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status_delegacia: novoStatus })
        });
        if (!res.ok) throw new Error('Erro ao atualizar status');
        buscarAlertas();
      } catch (e) {
        alert('Erro ao atualizar status: ' + e.message);
      }
    }

    // Polling automático
    buscarAlertas();
    setInterval(buscarAlertas, 5000);
  </script>
</body>
</html>
